name: Update RS dashboard

on:
  schedule:
    # UTC 22:30 Mon-Fri = 1.5-2.5h after US close (DST & standard), 06:30 HKT
    - cron: '30 22 * * 1-5'
    # Sun 22:30 UTC = Mon 06:30 HKT: refresh the new week's financial calendar
    - cron: '30 22 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite data even if the trading day is unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rs-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test formulas
        run: pytest -q

      - name: Fetch & compute
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data (only if trading day changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new trading day - nothing to commit."
          else
            git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json"))["as_of"])')"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
