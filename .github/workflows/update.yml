name: Update RS dashboard

on:
  schedule:
    # UTC 22:47 Mon-Fri = 06:47 HKT Tue-Sat, after the US close. Off the :00/:30 rush,
    # when GitHub delays (or drops) scheduled runs the most.
    - cron: '47 22 * * 1-5'
    # Backup 01:17 UTC Tue-Sat = 09:17 HKT, in case the first one is late or skipped.
    # Harmless if it already ran: an unchanged trading day writes nothing.
    - cron: '17 1 * * 2-6'
    # Sun 22:47 UTC = Mon 06:47 HKT: refresh the new week's financial calendar
    - cron: '47 22 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite data even if the trading day is unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rs-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, not the commit the run was queued on

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test formulas
        run: pytest -q

      - name: Fetch & compute
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data (only if trading day changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new trading day - nothing to commit."
          else
            git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json"))["as_of"])')"
            # watchlists.json may have been edited from the site meanwhile;
            # on a data/ clash keep this run's freshly computed files (-X theirs = our commit in a rebase)
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
